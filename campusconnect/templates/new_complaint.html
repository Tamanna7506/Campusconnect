<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New Complaint | CampusConnect</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f7ff;
        }

        /* NAVBAR */

        .navbar {
            height: 70px;
            padding: 0 40px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: linear-gradient(
                90deg,
                #2563eb,
                #6366f1,
                #7c3aed
            );

            color: white;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
        }

        .logo span {
            color: #ddd6fe;
        }

        .nav-right {
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            text-decoration: none;
            color: white;

            padding: 8px 14px;

            border: 1px solid rgba(255,255,255,0.45);

            border-radius: 8px;

            font-size: 13px;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.12);
        }


        /* MAIN */

        .main {
            max-width: 850px;

            margin: auto;

            padding: 40px 25px;
        }


        .heading {
            margin-bottom: 25px;
        }

        .heading h1 {
            color: #172554;

            font-size: 29px;

            margin-bottom: 7px;
        }

        .heading p {
            color: #64748b;

            font-size: 14px;
        }


        /* FORM CARD */

        .form-card {
            background: white;

            padding: 32px;

            border-radius: 18px;

            box-shadow:
                0 8px 30px rgba(30,64,175,0.08);
        }


        .form-group {
            margin-bottom: 22px;
        }


        label {
            display: block;

            color: #334155;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 8px;
        }


        input,
        select,
        textarea {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d7deea;

            border-radius: 10px;

            outline: none;

            font-size: 14px;

            color: #1e293b;

            background: white;

            transition: 0.2s;
        }


        input:focus,
        select:focus,
        textarea:focus {

            border-color: #6366f1;

            box-shadow:
                0 0 0 3px rgba(99,102,241,0.10);
        }


        textarea {

            min-height: 130px;

            resize: vertical;
        }


        .two-column {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 18px;
        }


        /* PRIORITY */

        .priority-options {

            display: flex;

            gap: 10px;
        }


        .priority-option {

            flex: 1;

            position: relative;
        }


        .priority-option input {

            position: absolute;

            opacity: 0;

            pointer-events: none;
        }


        .priority-option label {

            padding: 11px;

            text-align: center;

            border: 1px solid #d7deea;

            border-radius: 9px;

            cursor: pointer;

            color: #475569;

            font-weight: 500;

            transition: 0.2s;
        }


        .priority-option input:checked + label {

            border-color: #6366f1;

            background: #eef2ff;

            color: #4338ca;

        }


        /* BUTTONS */

        .buttons {

            display: flex;

            justify-content: flex-end;

            gap: 12px;

            margin-top: 28px;
        }


        .cancel-btn {

            text-decoration: none;

            padding: 12px 20px;

            border-radius: 9px;

            border: 1px solid #d7deea;

            color: #475569;

            font-size: 14px;

        }


        .submit-btn {

            border: none;

            padding: 12px 22px;

            border-radius: 9px;

            color: white;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            background: linear-gradient(
                90deg,
                #2563eb,
                #6366f1,
                #7c3aed
            );

            box-shadow:
                0 7px 18px rgba(79,70,229,0.20);
        }


        .submit-btn:hover {

            transform: translateY(-2px);

        }


        /* RESPONSIVE */

        @media (max-width: 650px) {

            .two-column {

                grid-template-columns: 1fr;

            }

            .form-card {

                padding: 22px;

            }

            .navbar {

                padding: 0 20px;

            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            Campus<span>Connect</span>
        </div>


        <div class="nav-right">

            <a href="/complaints" class="nav-btn">
                ← Complaints
            </a>

            <a href="/logout" class="nav-btn">
                Logout
            </a>

        </div>

    </nav>



    <!-- MAIN -->

    <main class="main">


        <div class="heading">

            <h1>
                🛠️ Submit New Complaint
            </h1>

            <p>
                Tell us about the issue and we'll help get it resolved.
            </p>

        </div>



        <div class="form-card">

            <form
                action="/complaints/new"
                method="POST"
            >


                <!-- TITLE -->

                <div class="form-group">

                    <label for="title">
                        Complaint Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="e.g. Wi-Fi not working in Computer Lab"
                        required
                    >

                </div>



                <!-- CATEGORY + LOCATION -->

                <div class="two-column">


                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>

                        <select
                            id="category"
                            name="category"
                            required
                        >

                            <option value="">
                                Select category
                            </option>

                            <option value="IT / Network">
                                IT / Network
                            </option>

                            <option value="Infrastructure">
                                Infrastructure
                            </option>

                            <option value="Electrical">
                                Electrical
                            </option>

                            <option value="Cleanliness">
                                Cleanliness
                            </option>

                            <option value="Classroom">
                                Classroom
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>



                    <div class="form-group">

                        <label for="location">
                            Location
                        </label>

                        <input
                            type="text"
                            id="location"
                            name="location"
                            placeholder="e.g. Computer Lab 2"
                            required
                        >

                    </div>


                </div>



                <!-- DESCRIPTION -->

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Describe the problem in detail..."
                        required
                    ></textarea>

                </div>



                <!-- PRIORITY -->

                <div class="form-group">

                    <label>
                        Priority
                    </label>


                    <div class="priority-options">


                        <div class="priority-option">

                            <input
                                type="radio"
                                id="low"
                                name="priority"
                                value="Low"
                                checked
                            >

                            <label for="low">
                                Low
                            </label>

                        </div>


                        <div class="priority-option">

                            <input
                                type="radio"
                                id="medium"
                                name="priority"
                                value="Medium"
                            >

                            <label for="medium">
                                Medium
                            </label>

                        </div>


                        <div class="priority-option">

                            <input
                                type="radio"
                                id="high"
                                name="priority"
                                value="High"
                            >

                            <label for="high">
                                High
                            </label>

                        </div>


                    </div>

                </div>



                <!-- BUTTONS -->

                <div class="buttons">

                    <a
                        href="/complaints"
                        class="cancel-btn"
                    >
                        Cancel
                    </a>


                    <button
                        type="submit"
                        class="submit-btn"
                    >
                        Submit Complaint
                    </button>

                </div>


            </form>

        </div>


    </main>


</body>

</html>
